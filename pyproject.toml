[project]
name = "flightinsight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pydeck>=0.9",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "structlog>=24.4",
    "slowapi>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/rag/ingest.py", "app/ml/train.py", "app/data/aviationstack.py"]

[tool.coverage.report]
show_missing = true
fail_under = 50
